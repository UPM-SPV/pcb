name: Comment status on PR


on:
  workflow_run:
    workflows: ["Continuous Integration"]
    types:
      - completed


permissions:
  actions: read
  contents: read


jobs:
  pr-comment:
    name: Comment status on PR
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Get PR number
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ -n "${EVENT_PR_NUMBER}" ]; then
            PR_NUMBER="${EVENT_PR_NUMBER}"
          else
            PR_NUMBER=$(gh api "repos/$REPOSITORY/commits/$HEAD_SHA/pulls" --jq '.[0].number')
          fi
          echo "PR_NUMBER=${PR_NUMBER}" >> "${GITHUB_ENV}"

      - name: Fetch CI report artifacts
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: ci-report
          path: ci-report

      - name: Post comment
        env:
          GH_TOKEN: ${{ secrets.USER_BOT_TOKEN }}
        run: |
          cd ci-report/
          files=()
          for file in *.png; do
            files+=(--attach "${file}")
          done

          gh pr comment ${PR_NUMBER} \
            --edit-last \
            --create-if-none \
            --body-file full-report.md \
            "${files[@]}"
